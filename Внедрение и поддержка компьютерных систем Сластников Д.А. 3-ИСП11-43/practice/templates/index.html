<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Мой список задач</title>
</head>

<body>
    <h1>Список задач</h1>

    <form method="POST" action="/add">
        <input type="text" name="title" placeholder="Новая задача..." required>
        <button type="submit">Добавить</button>
    </form>
    <hr>

    <ul>
        {% for task in tasks %}
        <li>
            <b>{{ task['title'] }}</b>
            (статус: {{ task['status'] }})
            <a href="/complete/{{ task['id'] }}">[Выполнено]</a>
            <a href="/delete/{{ task['id'] }}">[Удалить]</a>
        </li>
        {% else %}
        <li>Задач пока нет.</li>
        {% endfor %}
    </ul>
</body>

</html>
